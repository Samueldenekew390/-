<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>የአስተዳዳሪ መግቢያ - የኢትዮጲያ ሎተሪ እጣ</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-login-wrapper">
      <div class="admin-login-card">
        <div
          style="
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
          "
        >
          <img
            src="/assets/official_logo.jpg"
            alt="የኢትዮጲያ ሎተሪ እጣ"
            style="
              height: 70px;
              width: auto;
              object-fit: contain;
              border-radius: 8px;
              box-shadow: var(--shadow-sm);
            "
            onerror="
              this.onerror = null;
              this.src =
                'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'70\'><rect fill=\'%2313131a\' width=\'150\' height=\'70\'/><text fill=\'%23d97706\' font-size=\'14\' font-family=\'sans-serif\' font-weight=\'bold\' x=\'50%\' y=\'50%\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ሎተሪ</text></svg>';
            "
          />
          <span class="gold-badge">የአድሚን ዳሽቦርድ መግቢያ</span>
        </div>

        <h1 class="admin-login-title">የአስተዳዳሪ መግቢያ</h1>
        <p class="admin-login-subtitle">የአስተዳዳሪ ኢሜይል እና የይለፍ ቃልዎን ያስገቡ</p>

        <form id="admin-login-form">
          <div class="form-group" style="margin-bottom: 1.25rem">
            <label for="admin-email-input" class="form-label"
              >ኢሜይል (Email)</label
            >
            <input
              type="email"
              id="admin-email-input"
              class="form-control"
              placeholder="admin@ethiolottery.et"
              value="admin@ethiolottery.et"
              required
              style="font-size: 1rem"
              autocomplete="email"
            />
          </div>

          <div class="form-group" style="margin-bottom: 1.25rem">
            <label for="admin-password-input" class="form-label"
              >የይለፍ ቃል (Password)</label
            >
            <input
              type="password"
              id="admin-password-input"
              class="form-control"
              placeholder="የይለፍ ቃል ያስገቡ"
              required
              style="font-size: 1rem"
              autocomplete="current-password"
            />
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 1.75rem;
            "
          >
            <label
              style="
                display: flex;
                align-items: center;
                gap: 0.5rem;
                color: var(--text-muted);
                font-size: 0.9rem;
                cursor: pointer;
              "
            >
              <input
                type="checkbox"
                id="remember-me-check"
                checked
                style="accent-color: var(--primary)"
              />
              አስታውሰኝ (Remember Me)
            </label>
          </div>

          <button
            type="submit"
            id="admin-login-submit-btn"
            class="btn-primary"
            style="
              width: 100%;
              padding: 0.9rem;
              font-size: 1.1rem;
              font-weight: 800;
              justify-content: center;
            "
          >
            ግባ 🔐
          </button>
        </form>

        <div
          id="login-error-msg"
          style="
            display: none;
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: var(--radius-sm);
            color: var(--accent-red);
            font-size: 0.9rem;
            text-align: center;
          "
        ></div>

        <div
          style="
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-dim);
            text-align: center;
          "
        >
          Password:
          <code style="color: var(--primary); font-weight: 700">wrong</code> or
          <code style="color: var(--primary); font-weight: 700"
            >you got one chance left</code
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        // Check if already authenticated
        await AdminAuth.checkAuthAndRedirect();

        const form = document.getElementById("admin-login-form");
        const submitBtn = document.getElementById("admin-login-submit-btn");
        const errorMsg = document.getElementById("login-error-msg");

        if (form) {
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (errorMsg) errorMsg.style.display = "none";

            const email = document.getElementById("admin-email-input").value;
            const pass = document.getElementById("admin-password-input").value;
            const remember =
              document.getElementById("remember-me-check").checked;

            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.innerHTML = "በመግባት ላይ... ⏳";
            }

            try {
              const res = await AdminAuth.login(email, pass, remember);
              if (res.success) {
                Utils.showToast("በትክክል ገብተዋል!", "success");
                setTimeout(() => {
                  window.location.replace("admin.html");
                }, 400);
              } else {
                if (errorMsg) {
                  errorMsg.textContent = res.message || "የተሳሳተ መረጃ አስገብተዋል።";
                  errorMsg.style.display = "block";
                }
                Utils.showToast(res.message || "መግባት አልተቻለም", "error");
                if (submitBtn) {
                  submitBtn.disabled = false;
                  submitBtn.innerHTML = "ግባ 🔐";
                }
              }
            } catch (err) {
              console.error("Login error:", err);
              if (errorMsg) {
                errorMsg.textContent = "ስህተት ተከስቷል። እባክዎ እንደገና ይሞክሩ።";
                errorMsg.style.display = "block";
              }
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = "ግባ 🔐";
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
