<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የቲኬት መረጃ ተልኳል - የኢትዮጲያ ሎተሪ እጣ</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
</head>
<body>

  <!-- SITE HEADER -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo-container">
        <img src="/assets/official_logo.jpg" alt="የኢትዮጲያ ሎተሪ እጣ" class="brand-logo-img" />
        <span class="brand-title">የኢትዮጲያ ሎተሪ እጣ</span>
      </a>
    </div>
  </header>

  <!-- SUCCESS CONTENT -->
  <section style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="container" style="max-width: 600px; text-align: center;">
      
      <div style="
        background: var(--surface-card);
        border: 1px solid var(--border-gold);
        border-radius: var(--radius-lg);
        padding: 3.5rem 2rem;
        box-shadow: var(--shadow-gold), var(--shadow);
      ">
        <div style="
          width: 90px;
          height: 90px;
          background: linear-gradient(135deg, rgba(212,175,55,0.3), rgba(212,175,55,0.1));
          border: 2px solid var(--primary);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 3rem;
          margin: 0 auto 2rem auto;
          box-shadow: 0 0 30px rgba(212,175,55,0.3);
        ">
          🎉
        </div>

        <!-- EXACT REQUIRED SUCCESS TEXT 1 -->
        <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; line-height: 1.4;">
          መረጃዎ በትክክል ተልኳል።
        </h2>

        <!-- EXACT REQUIRED SUCCESS TEXT 2 -->
        <p style="font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 2.5rem; line-height: 1.5;">
          መስከረም 1 በአዲስ አመት አሸናፊ ከሆኑ መልዕክት ይደርሶታል!
        </p>

        <div>
          <a href="index.html" class="btn-primary" style="font-size: 1.1rem; padding: 0.9rem 2.25rem;">
            ወደ መነሻ ገፅ ተመለስ 🏠
          </a>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span id="footer-legal-info">መብቱ በህግ የተጠበቀ ነው። © 2026 የኢትዮጲያ ሎተሪ እጣ</span>
        <span>የኢትዮጲያ ሎተሪ እጣ</span>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
